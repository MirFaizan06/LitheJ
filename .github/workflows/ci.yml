name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [17, 21, 25]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Make mvnw executable
        if: runner.os != 'Windows'
        run: chmod +x ./mvnw

      - name: Build and verify (tests, Checkstyle, SpotBugs, PMD, JaCoCo, Javadoc)
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7

      - name: Upload JaCoCo coverage report (JDK 21 on Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: '**/target/site/jacoco/'
          retention-days: 14

  examples:
    name: examples and demos compile
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Install library modules to the local repository
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dpmd.skip=true -Djacoco.skip=true install

      - name: Build examples
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/pom.xml verify

      - name: Build demos
        run: ./mvnw --batch-mode --no-transfer-progress -f demos/pom.xml verify
