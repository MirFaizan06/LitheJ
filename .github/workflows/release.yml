name: Release

# Triggered by pushing a tag like v1.0.0. Never publishes if tests or quality
# gates fail. Central/GPG publishing steps are skipped automatically (not
# failed) when the corresponding repository secrets are not configured, so
# this workflow is safe to run before those secrets exist.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish release
    runs-on: ubuntu-latest
    env:
      HAS_CENTRAL_CREDENTIALS: ${{ secrets.CENTRAL_TOKEN_USERNAME != '' && secrets.CENTRAL_TOKEN_PASSWORD != '' }}
      HAS_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Import GPG signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "gpg-passphrase=${{ secrets.GPG_PASSPHRASE }}" >> "$GITHUB_ENV"

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set project version to release version
        run: ./mvnw --batch-mode --no-transfer-progress versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Full verify (tests, Checkstyle, SpotBugs, PMD, JaCoCo gate, Javadoc)
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Package (jar, sources jar, javadoc jar)
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Collect release artifacts and checksums
        run: |
          mkdir -p release-artifacts
          find . -path '*/target/*.jar' -not -path '*/target/*-tests.jar' -exec cp {} release-artifacts/ \;
          cd release-artifacts
          sha256sum *.jar > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Deploy documentation
        run: |
          mkdir -p site-deploy
          cp -r docs/. site-deploy/
        # Actual Pages deployment is handled by the separate pages.yml
        # workflow on pushes to main; this step is a placeholder kept in
        # sync so a release also regenerates the docs bundle artifact.

      # NOTE: the Central Publishing Portal's exact CI authentication mechanism
      # (environment variables vs. a settings.xml <server> block vs. plugin
      # -D properties) has changed over time. CENTRAL_TOKEN_USERNAME /
      # CENTRAL_TOKEN_PASSWORD as plain environment variables is the
      # mechanism documented by the central-publishing-maven-plugin at the
      # time this workflow was written (see CONTRIBUTING.md). Re-check
      # https://central.sonatype.org/publish/publish-portal-maven/ before
      # the first real release in case that has changed.
      - name: Publish to Maven Central
        if: env.HAS_CENTRAL_CREDENTIALS == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Prelease -DskipTests \
            -Dgpg.passphrase="$GPG_PASSPHRASE" \
            deploy

      - name: Skip Maven Central publish (credentials not configured)
        if: env.HAS_CENTRAL_CREDENTIALS != 'true' || env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::Skipping Maven Central publish: CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD, GPG_PRIVATE_KEY, and/or GPG_PASSPHRASE repository secrets are not set. See CONTRIBUTING.md for setup instructions. The GitHub Release and its attached JARs were still published."
