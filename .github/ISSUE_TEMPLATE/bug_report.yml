name: Bug report
description: Report something that isn't working as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LitheJ version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: JDK version and vendor
      placeholder: "Temurin 21.0.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short, self-contained code snippet that shows the problem.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full stack trace if there is an exception.
    validations:
      required: true
